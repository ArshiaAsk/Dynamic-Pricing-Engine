data:
  feature_path: data/features/training_features.parquet
  # Dataset size and seed for scripts/regenerate_data.py (DECISIONS D30):
  # 50 products x 365 days = 18,250 raw rows / 16,500 feature rows.
  n_products: 50
  days: 365
  seed: 42

model:
  n_estimators: 600
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0
  reg_alpha: 0
  reg_lambda: 1

pricing:
  model_path: models/demand_model.pkl
  feature_columns_path: models/features.json
  # Written by training from the train split (D32); loaded at startup.
  training_support_path: models/training_support.json

training:
  # Validation set = most recent `test_size` fraction of the timeline.
  # The split is chronological (DECISIONS D6), so there is no `random_state`.
  test_size: 0.2
  model_dir: models
  report_dir: reports
  # Enable cross-validation (can be slow)
  run_cv: false
  # Hyperparameter tuning: read by scripts/train_with_tuning.py
  tuning_trials: 50

features:
  lag_days: [1, 7, 14]
  rolling_windows: [7, 14, 28]
  min_history_days: 35
