 # Development Configuration
 data:
   raw_path: data/raw
   processed_path: data/processed
   feature_path: data/features/training_features.parquet
 
 model:
   demand_model: xgboost
   max_depth: 6
   learning_rate: 0.05
   n_estimators: 600
   subsample: 0.8
   colsample_bytree: 0.8
   min_child_weight: 1
   gamma: 0
   reg_alpha: 0
   reg_lambda: 1
 
 pricing:
   price_min_multiplier: 0.7
   price_max_multiplier: 1.3
   price_steps: 50
   model_path: models/demand_model.pkl
   feature_columns_path: models/features.json
   price_min: 30.0
   price_max: 120.0
   default_method: bayesian
   
 training:
   test_size: 0.2
   random_state: 42
   model_dir: models
   report_dir: reports
   run_cv: false
   cv_folds: 5
   run_hyperparameter_tuning: false
   tuning_trials: 50
 
 features:
   raw_filename: "ecommerce_sales.csv"
   feature_filename: "training_features.parquet"
   lag_days: [1, 7, 14]
   rolling_windows: [7, 14, 28]
   min_history_days: 35
 
 monitoring:
   enabled: true
   log_dir: logs/monitoring
   drift_threshold: 0.1
   performance_degradation_threshold: 0.1
   check_interval_hours: 24
 
 api:
   host: 0.0.0.0
   port: 8000
   workers: 1
   reload: true
   timeout: 60
   cors_enabled: true
   cors_origins: ["http://localhost:3000", "http://localhost:8080"]
   rate_limit_enabled: false
   rate_limit_requests: 1000
   rate_limit_window: 60
 
 logging:
   level: DEBUG
   format: text
   rotation: daily
   retention_days: 7
