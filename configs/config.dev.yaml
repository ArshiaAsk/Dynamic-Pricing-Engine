# Development configuration.
#
# Only keys read by first-party code live here (ROADMAP R18 / CONVENTIONS
# rule 5). Runtime toggles (API host/port/workers, rate limiting, logging)
# come from environment variables, not this file (DECISIONS D11).
data:
  feature_path: data/features/training_features.parquet

model:
  n_estimators: 600
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0
  reg_alpha: 0
  reg_lambda: 1

pricing:
  model_path: models/demand_model.pkl
  feature_columns_path: models/features.json
  price_min: 30.0
  price_max: 120.0

training:
  test_size: 0.2
  model_dir: models
  report_dir: reports
  run_cv: false
  tuning_trials: 50

features:
  lag_days: [1, 7, 14]
  rolling_windows: [7, 14, 28]
  min_history_days: 35
