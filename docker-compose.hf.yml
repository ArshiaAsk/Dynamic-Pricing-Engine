version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.hf
    container_name: pricing-hf
    ports:
      - "7860:7860"
      - "8000:8000"
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://localhost:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
