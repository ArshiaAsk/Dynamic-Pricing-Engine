services:

  mlflow-db:
    image: postgres:15
    container_name: mlflow-db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_db:/var/lib/postgresql/data
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: dynamic-pricing-mlflow:latest
    container_name: mlflow-server
    working_dir: /mlflow
    volumes:
      - ./mlflow:/mlflow
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      - mlflow-db
    restart: unless-stopped

  pricing-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dynamic-pricing:latest
    container_name: pricing-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./configs:/app/configs:ro
      - app_logs:/app/logs
    depends_on:
      - mlflow
    restart: unless-stopped

volumes:
  mlflow_db:
  mlflow_artifacts:
  app_logs:
