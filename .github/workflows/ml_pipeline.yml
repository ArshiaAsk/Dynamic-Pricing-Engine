name: ML Pipeline

on:
    push:
        branches: [ main ]

jobs:

    train-and-register:
        runs-on: ubuntu-latest

        steps:

            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.10"

            - name: Install dependencies
              run: |
                pip install -r requirements.txt

            - name: Generate additional synthetic data
              run: |
                python src/data/generator.py --append -n_rows 500

            - name: Run data validation
              run: | 
                python src/data/validation.py

            - name: Run data pipeline
              run: |
                python src/data/pipeline_runner.py
            
            - name: Train model
              run: |
                python scripts/train_with_tuning.py