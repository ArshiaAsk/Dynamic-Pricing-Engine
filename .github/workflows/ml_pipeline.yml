name: ML Pipeline

on:
  push:
    branches: [main]

env:
  PYTHONPATH: ${{ github.workspace }}
  MLFLOW_TRACKING_URI: file:${{ github.workspace }}/mlruns
  TUNING_TRIALS: '10'

jobs:
  train-and-register:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate additional synthetic data
        run: |
          python src/data/generator.py

      - name: Run data validation
        run: |
          python src/data/validation.py

      - name: Run data pipeline
        run: |
          python src/data/pipeline_runner.py

      - name: Build features
        run: |
          python src/features/feature_pipeline.py

      - name: Train model
        run: |
          python scripts/train_with_tuning.py

      - name: Run drift tests
        run: |
          pytest tests/test_data_drift.py

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/demand_model.pkl
            models/features.json
            reports/training_metrics.json
          retention-days: 14
