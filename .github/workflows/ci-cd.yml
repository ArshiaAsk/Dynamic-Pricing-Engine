name: CI/CD Pipeline with Auto-Promotion

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: ${{ github.workspace }}
  MLFLOW_TRACKING_URI: file:${{ github.workspace }}/mlruns
  TUNING_TRIALS: '5'
  MODEL_PERFORMANCE_THRESHOLD: 0.40  # Minimum R² for promotion

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Prepare data and model for tests
      run: |
        python src/data/pipeline_runner.py
        python src/features/feature_pipeline.py
        python scripts/train_with_tuning.py
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy
    
    - name: Run flake8
      run: |
        flake8 src/ --max-line-length=120 --ignore=E203,W503
      continue-on-error: true
    
    - name: Check code formatting
      run: |
        black --check src/
      continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build image
      run: |
        docker build -t pricing-engine:${{ github.sha }} .
    
    - name: Save image
      run: |
        docker save pricing-engine:${{ github.sha }} | gzip > pricing-engine.tar.gz
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: docker-image
        path: pricing-engine.tar.gz
        retention-days: 7

  model-validation:
    name: Validate Model Performance
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Prepare data and model
      run: |
        python src/data/pipeline_runner.py
        python src/features/feature_pipeline.py
        python scripts/train_with_tuning.py
    
    - name: Check model exists
      run: |
        if [ ! -f "models/demand_model.pkl" ]; then
          echo "Model file not found. Training required."
          exit 1
        fi
    
    - name: Validate model performance
      run: |
        python3 scripts/validate_model.py
    
    - name: Check performance threshold
      run: |
        R2=$(cat reports/training_metrics.json | python3 -c "import sys, json; print(json.load(sys.stdin)['R2'])")
        echo "Model R²: $R2"
        
        if (( $(echo "$R2 < $MODEL_PERFORMANCE_THRESHOLD" | bc -l) )); then
          echo "Model performance below threshold ($MODEL_PERFORMANCE_THRESHOLD)"
          exit 1
        fi
        
        echo "Model performance acceptable for production"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, model-validation]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
     
    - name: Download Docker image
      uses: actions/download-artifact@v3
      with:
        name: docker-image
    
    - name: Deploy to staging server
      run: |
        # Transfer files to staging
        rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
          --exclude '.git' \
          --exclude '__pycache__' \
          --exclude 'logs/' \
          ./ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ secrets.STAGING_DIR }}/
        
        # Deploy on staging server
        ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'ENDSSH'
          cd ${{ secrets.STAGING_DIR }}
          docker-compose -f docker-compose.prod.yml build
          docker-compose -f docker-compose.prod.yml up -d
          sleep 30
        ENDSSH

  smoke-test-staging:
    name: Smoke Tests (Staging)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install requests pytest
    
    - name: Wait for service to be ready
      run: |
        echo "Waiting for staging service to be ready..."
        for i in {1..30}; do
          if curl -f ${{ secrets.STAGING_URL }}/v1/health; then
            echo "Service is ready"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 10
        done
    
    - name: Run smoke tests
      env:
        API_URL: ${{ secrets.STAGING_URL }}
      run: |
        python3 tests/smoke_tests.py

  auto-promote-production:
    name: Auto-Promote to Production
    runs-on: ubuntu-latest
    needs: [smoke-test-staging]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
    
    - name: Download Docker image
      uses: actions/download-artifact@v3
      with:
        name: docker-image
    
    - name: Deploy to production server
      run: |
        # Transfer files to production
        rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
          --exclude '.git' \
          --exclude '__pycache__' \
          --exclude 'logs/' \
          ./ ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:${{ secrets.PRODUCTION_DIR }}/
        
        # Deploy on production server
        ssh -i ~/.ssh/deploy_key ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
          cd ${{ secrets.PRODUCTION_DIR }}
          docker-compose -f docker-compose.prod.yml build
          docker-compose -f docker-compose.prod.yml up -d
          sleep 30
        ENDSSH
    
    - name: Verify production health
      run: |
        for i in {1..10}; do
          if curl -f ${{ secrets.PRODUCTION_URL }}/v1/health; then
            echo "✓ Production deployment successful"
            exit 0
          fi
          echo "Waiting for production service... ($i/10)"
          sleep 10
        done
        echo "✗ Production deployment verification failed"
        exit 1
    
    - name: Create deployment tag
      run: |
        TAG="deploy-$(date +%Y%m%d-%H%M%S)"
        git tag -a "$TAG" -m "Production deployment: ${{ github.sha }}"
        git push origin "$TAG"

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [auto-promote-production]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.auto-promote-production.result == 'success'
      run: |
        echo "✅ Successfully deployed to production"
        # Add notification logic (Slack, email, etc.)
    
    - name: Notify failure
      if: needs.auto-promote-production.result == 'failure'
      run: |
        echo "❌ Production deployment failed"
        # Add notification logic
